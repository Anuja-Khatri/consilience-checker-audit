[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consilience-checker-audit"
version = "0.1.0"
description = "Contract-driven integrity checks for evaluation graders and answer extractors, with receipts and an independent second-way verifier."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anuja Khatri" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/Anuja-Khatri/consilience-checker-audit"

[project.scripts]
checker-audit = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

# The checker modules live under src/ and are loaded by cli.py relative to its
# own location. Use an editable install so they resolve from the repo:
#   pip install -e .   &&   checker-audit run-all
# Or, with no install at all, just: python cli.py run-all
