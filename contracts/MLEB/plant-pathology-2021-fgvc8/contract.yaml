kind: mleb-grader-contract
competition_id: plant-pathology-2021-fgvc8
contract_author: model
source:
  repo: https://github.com/openai/mle-bench
  commit: 507f92e1138bb6e40dac5c6ee7a6758e6424bf97
  grade_path: mlebench/competitions/plant-pathology-2021-fgvc8/grade.py
description: >
  Metric: micro-averaged multilabel F1 over space-separated disease labels.
  Bounded in [0, 1], higher is better. The grader checks the image/labels
  columns, requires equal lengths, sorts by 'image', and then asserts the image
  columns match elementwise.

id_column: image
prediction_columns: [labels]
submission_extra_columns: []
group_column: null

metric:
  direction: higher_better
  bounded: [0, 1]

answers:
  id: ["img0", "img1", "img2", "img3", "img4", "img5"]
  columns:
    labels: ["healthy", "scab", "rust", "healthy complex", "frog_eye_leaf_spot", "powdery_mildew"]

leaderboard: [0.98, 0.95, 0.90, 0.85, 0.80, 0.75, 0.70, 0.65, 0.60, 0.55]

reference:
  kind: exact              # exact labels -> micro F1 = 1.0

checks:
  - order_invariance
  - reject_wrong_length

labels: []
notes: >
  Clean, well-validated grader: HOLDS. order_invariance PASSES because the grader
  sorts by 'image' and checks the image columns match after the sort.
  reject_wrong_length PASSES because the grader rejects any length mismatch with
  an InvalidSubmissionError.
  The prediction column 'labels' is a free-text multilabel STRING, so the
  harness checks that perturb a prediction by float arithmetic (reject_nonfinite,
  reject_duplicate_ids, range, no_free_gold_subset_perfect) are not applicable
  and are omitted. Reading the code confirms duplicates are caught anyway: a
  duplicated 'image' makes the submission longer than the answers -> the length
  check raises; the metric is bounded in [0, 1] so no favorable-infinity path
  exists.
