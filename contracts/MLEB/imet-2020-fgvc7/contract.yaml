kind: mleb-grader-contract
competition_id: imet-2020-fgvc7
contract_author: model
source:
  repo: https://github.com/openai/mle-bench
  commit: 507f92e1138bb6e40dac5c6ee7a6758e6424bf97
  grade_path: mlebench/competitions/imet-2020-fgvc7/grade.py
description: >
  Metric: micro-averaged F1 over multi-label attribute predictions. Higher is
  better, bounded [0, 1]. Validity (from the Kaggle task): a submission has an
  `id` column matching the answers and an `attribute_ids` column holding a
  space-separated string of attribute ids per id. The grader checks the id and
  attribute_ids columns, equal length, sorts by id and re-checks id equality,
  then binarizes with MultiLabelBinarizer.

id_column: id
prediction_columns: [attribute_ids]
submission_extra_columns: []
group_column: null

metric:
  direction: higher_better
  bounded: [0, 1]

answers:
  id: [1, 2, 3, 4, 5, 6]
  columns:
    attribute_ids: ["0 1", "2", "1 3", "0", "2 3", "1"]

leaderboard: [0.95, 0.90, 0.85, 0.80, 0.75, 0.70, 0.65, 0.60, 0.55, 0.50]

reference:
  kind: exact            # attribute_ids == answers -> micro F1 1.0

checks:
  - order_invariance
  - reject_wrong_length

labels: []
notes: >
  Expected to HOLD. The grader aligns by id (sort + elementwise id check + length
  check), so order_invariance and reject_wrong_length hold, and micro F1 is
  bounded [0, 1] so there is no finiteness gap. Two checks are intentionally NOT
  listed because they are not applicable to a string `attribute_ids` column: (1)
  reject_nonfinite injects a float inf, which pandas refuses to assign to the
  string-dtype column (TypeError) -- and in any case a NaN is filled to "" and an
  inf makes .str.split() return NaN -> MultiLabelBinarizer raises -> None, winning
  no medal; (2) reject_duplicate_ids casts the label string to float, which raises
  ValueError. The grader's length + id checks reject duplicate-id rows anyway.
