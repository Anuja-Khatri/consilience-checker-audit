kind: mleb-grader-contract
competition_id: tweet-sentiment-extraction
contract_author: model
source:
  repo: https://github.com/openai/mle-bench
  commit: 507f92e1138bb6e40dac5c6ee7a6758e6424bf97
  grade_path: mlebench/competitions/tweet-sentiment-extraction/grade.py
description: >
  Metric: mean word-level Jaccard between the predicted selected_text and the
  answer selected_text. Bounded [0, 1], higher is better. Validity (from the
  Kaggle task): a submission has a textID column matching the answers and a
  selected_text string per textID. The prediction is a STRING, not numeric, so
  the numeric checks (reject_nonfinite, range) do not apply and are not listed.

id_column: textID
prediction_columns: [selected_text]
submission_extra_columns: []
group_column: null

metric:
  direction: higher_better
  bounded: [0, 1]

answers:
  id: [1, 2, 3, 4, 5]
  columns:
    selected_text: ["very good", "bad", "okay fine", "not great", "yes indeed"]

leaderboard: [0.90, 0.85, 0.80, 0.75, 0.72, 0.70, 0.68, 0.60, 0.50, 0.40]

reference:
  kind: exact

checks:
  - order_invariance
  - reject_wrong_length

labels: []
notes: >
  Expected to HOLD. The grader sorts by textID and checks the textID set after
  sorting, so grading is id-based (order_invariance PASS). It checks equal row
  count (reject_wrong_length PASS). Prediction is a string, so reject_nonfinite,
  range and reject_duplicate_ids are not applicable: the duplicate-id check
  perturbs predictions numerically (float(str) would raise), and there is no
  numeric range. A separately noted robustness edge (both-empty strings give
  0/0 -> ZeroDivisionError -> None, i.e. an invalid submission with no medal) is
  not an exploit and is not a BLOCK; the length check also makes a duplicate row
  raise InvalidSubmissionError (row count would differ).
