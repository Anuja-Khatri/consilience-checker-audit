kind: mleb-grader-contract
competition_id: petfinder-pawpularity-score
contract_author: model
source:
  repo: https://github.com/openai/mle-bench
  commit: 507f92e1138bb6e40dac5c6ee7a6758e6424bf97
  grade_path: mlebench/competitions/petfinder-pawpularity-score/grade.py
description: >
  Metric: RMSE of Pawpularity. Lower is better. Validity (from the Kaggle task):
  a submission has an Id column matching the answers and a Pawpularity value in
  [1, 100] per Id. This grader checks the range on both sides and aligns by Id.

id_column: Id
prediction_columns: [Pawpularity]
submission_extra_columns: []
group_column: null

metric:
  direction: lower_better
  bounded: [0, 99]

prediction_range: [1, 100]

answers:
  id: [1, 2, 3, 4, 5]
  columns:
    Pawpularity: [20, 40, 60, 80, 95]

leaderboard: [5, 8, 10, 12, 15, 18, 20, 25, 30, 40]

reference:
  kind: offset
  offset: 2.0              # [22, 42, 62, 82, 97], all within [1, 100]

checks:
  - reject_nonfinite
  - order_invariance
  - reject_wrong_length
  - reject_duplicate_ids
  - range

labels: []
notes: >
  Expected to HOLD on every check: the grader validates the [1, 100] range on
  both sides, aligns by Id with a sort, and checks the id set. Included as a
  clean, well-validated grader, to show that a HOLDS is a reported result.
