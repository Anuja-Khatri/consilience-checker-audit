labels: []
notes: >
  Expected to HOLD on every listed check. lwlrap is bounded in [0, 1]. sklearn's
  label_ranking_average_precision_score validates its inputs with check_array,
  which rejects NaN/+-inf (ValueError -> swallowed to None), so reject_nonfinite
  holds. The explicit length check rejects the short submission and the
  duplicated-id submission (both change the row count). The grader sorts by
  `fname`, so a row permutation is invariant. `range` is not listed: lwlrap is a
  ranking metric with no [0,1] bound enforced on the raw scores. No aggregation
  group column, so no_free_gold_subset_perfect is not listed.
