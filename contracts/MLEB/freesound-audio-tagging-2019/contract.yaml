  columns keyed by `fname`. Higher is better; bounded in [0, 1]. Validity
  (local prepare_for_metric): the submission must have the SAME LENGTH as the
  answers, its first column must be `fname`, its remaining columns must equal
  the 80 CLASS_NAMES exactly and in order, and the same `fname`s after sorting.
  Values are coerced with pd.to_numeric (non-numeric -> InvalidSubmissionError).

