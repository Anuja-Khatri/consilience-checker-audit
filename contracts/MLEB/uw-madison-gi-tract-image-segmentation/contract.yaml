kind: mleb-grader-contract
competition_id: uw-madison-gi-tract-image-segmentation
contract_author: model
source:
  repo: https://github.com/openai/mle-bench
  commit: 507f92e1138bb6e40dac5c6ee7a6758e6424bf97
  grade_path: mlebench/competitions/uw-madison-gi-tract-image-segmentation/grade.py
description: >
  Metric: 0.4 * mean Dice + 0.6 * (1 - mean normalized Hausdorff). Higher is
  better. Predictions are run-length-encoded (RLE) mask STRINGS, not numeric, so
  the numeric checks (reject_nonfinite, range) do not apply. Validity: the
  grader only checks that the submission has the columns {id, class, predicted};
  it does NOT check row count and does NOT check the id set. The answers carry
  image_height/image_width (used for RLE decoding) which are not part of a
  submission.

id_column: id
prediction_columns: [predicted]
submission_extra_columns: [class]
group_column: null

metric:
  direction: higher_better
  bounded: [null, 1]

answers:
  id:
    - "case1_day1_slice_0001"
    - "case1_day1_slice_0002"
    - "case2_day1_slice_0001"
    - "case3_day1_slice_0001"
  columns:
    predicted: ["1 1", "1 2", "1 3", "1 4"]
    class: ["large_bowel", "large_bowel", "large_bowel", "large_bowel"]
    image_height: [2, 2, 2, 2]
    image_width: [2, 2, 2, 2]

leaderboard: [0.98, 0.95, 0.92, 0.90, 0.88, 0.85, 0.80, 0.75, 0.70, 0.60]

reference:
  kind: exact

checks:
  - order_invariance
  - reject_wrong_length

labels: []
notes: >
  Two genuine structural gaps are demonstrated (both expected to BLOCK):
  (1) order_invariance -- the Dice term pairs submission masks with answer masks
  by ROW POSITION (zip, no sort or id alignment), so the same submission in a
  different row order scores differently. The Hausdorff term regroups by id and
  is order-robust, but it cannot mask the Dice change.
  (2) reject_wrong_length -- the grader has NO row-count and NO id-set check;
  zip silently truncates to the shorter list. A submission missing its last row
  (here the whole case3_day1 case) is still scored on the rows it does provide
  and, being perfect there, wins a medal. The synthetic answers are arranged so
  the dropped row is its own case_day, giving a clean truncated score of 1.0.
  Numeric checks are not listed: predictions are RLE strings (reject_nonfinite
  fills NaN -> "" i.e. an empty mask, not a finiteness probe; range has no
  meaning; reject_duplicate_ids perturbs predictions with float(str)+1000 which
  would raise). Malformed RLE raises AssertionError -> swallowed -> None, which
  is a separate swallowed-exception class, not exercised here. These positional
  / no-length-check gaps are not matched to a specific LABELS.yaml id (the known
  segmentation/leakage issues are distinct); reported as findings on code read
  and demonstrated by the checks below.
